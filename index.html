
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANIYEH | Creative Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #f7f3eb;
  --gold: #a88b55;
  --dark: #292820;
  --muted: #777267;
  --line: #d9cdb7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--dark);
  font-family: 'Vazirmatn', sans-serif;
  min-height: 100vh;
}

header {
  height: 78px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.logo {
  font: 600 25px 'Playfair Display', serif;
  letter-spacing: 3px;
}

select {
  background: transparent;
  border: 1px solid var(--line);
  padding: 9px 14px;
  color: var(--dark);
  border-radius: 20px;
  font: inherit;
}

main {
  min-height: calc(100vh - 145px);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 20px;
}

.content { max-width: 780px; }

.eyebrow {
  color: var(--gold);
  letter-spacing: 4px;
  font-size: 13px;
}

h1 {
  font: 600 clamp(65px, 13vw, 125px)/1.2 'Playfair Display', serif;
  letter-spacing: 5px;
  margin: 22px 0;
}

.line {
  width: 85px;
  height: 1px;
  background: var(--gold);
  margin: 25px auto;
}

.description {
  color: var(--muted);
  font-size: 17px;
  line-height: 2;
  max-width: 580px;
  margin: auto;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 35px;
}

.button {
  display: inline-block;
  padding: 13px 25px;
  border: 1px solid var(--gold);
  color: var(--dark);
  text-decoration: none;
  transition: .25s;
}

.button.primary {
  background: var(--gold);
  color: white;
}

.button:hover {
  transform: translateY(-3px);
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

body[dir="ltr"] {
  font-family: Arial, sans-serif;
}

@media(max-width:500px) {
  header { padding: 0 5%; }
  .description { font-size: 15px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">HANIYEH</div>

  <select id="language" aria-label="Language">
    <option value="fa">فارسی</option>
    <option value="en">English</option>
    <option value="it">Italiano</option>
  </select>
</header>

<main>
  <div class="content">

    <div class="eyebrow" id="eyebrow">
      هنر · تصویر · روایت
    </div>

    <h1>HANIYEH</h1>

    <div class="line"></div>

    <p class="description" id="description">
      فضایی برای دیدن جهان از دریچه عکاسی،
      طراحی گرافیک و هنرهای تصویری.
    </p>

    <div class="buttons">
      <a class="button primary" href="HaniyehPortfolio.html" id="portfolio">
        ورود به پورتفولیو
      </a>

      <a class="button" href="academic.html" id="academic">
        پروفایل آکادمیک
      </a>
    </div>

  </div>
</main>

<footer id="footer">
  عکاسی و طراحی گرافیک | حانیه حدادی
</footer>

<script>
const translations = {
  fa: {
    dir: "rtl",
    eyebrow: "هنر · تصویر · روایت",
    description: "فضایی برای دیدن جهان از دریچه عکاسی، طراحی گرافیک و هنرهای تصویری.",
    portfolio: "ورود به پورتفولیو",
    academic: "پروفایل آکادمیک",
    footer: "عکاسی و طراحی گرافیک | حانیه حدادی"
  },
  en: {
    dir: "ltr",
    eyebrow: "ART · IMAGE · STORY",
    description: "A space for seeing the world through photography, graphic design, and visual arts.",
    portfolio: "Explore Portfolio",
    academic: "Academic Profile",
    footer: "Photography & Graphic Design | Haniyeh Haddadi"
  },
  it: {
    dir: "ltr",
    eyebrow: "ARTE · IMMAGINE · RACCONTO",
    description: "Uno spazio per osservare il mondo attraverso fotografia, graphic design e arti visive.",
    portfolio: "Esplora il Portfolio",
    academic: "Profilo Accademico",
    footer: "Fotografia e Graphic Design | Haniyeh Haddadi"
  }
};

const language = document.getElementById("language");

function changeLanguage(lang) {
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("description").textContent = t.description;
  document.getElementById("portfolio").textContent = t.portfolio;
  document.getElementById("academic").textContent = t.academic;
  document.getElementById("footer").textContent = t.footer;

  localStorage.setItem("haniyeh-language", lang);
}

language.addEventListener("change", () => {
  changeLanguage(language.value);
});

const savedLanguage = localStorage.getItem("haniyeh-language") || "fa";
language.value = savedLanguage;
changeLanguage(savedLanguage);
</script>

</body>
</html>
