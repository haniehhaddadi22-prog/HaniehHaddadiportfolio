<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری عکاسی | حانیه حدادی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f7f4ef;
            color: #29251f;
            font-family: Tahoma, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .gallery-intro {
            text-align: center;
            margin-bottom: 30px;
            color: #6d655c;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery-grid img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-grid img:hover {
            transform: scale(1.02);
        }

        .back-link {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 10px 20px;
            color: #29251f;
            border: 1px solid #29251f;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .back-link:hover {
            background: #29251f;
            color: #f7f4ef;
        }

        dialog {
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #242424;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.88);
        }

        dialog img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            margin: auto;
            object-fit: contain;
        }

        dialog button {
            display: block;
            margin: 0 auto 10px;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #f7f4ef;
            color: #29251f;
            font-family: inherit;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .gallery-grid img {
                height: 190px;
            }
        }
    </style>
</head>

<body>
    <h1 id="galleryTitle">عکاسی پرتره</h1>
    <p class="gallery-intro" id="galleryIntro">
        مجموعه‌ای از عکس‌های این پروژه
    </p>

    <div class="gallery-grid" oncontextmenu="return false;">
    <img src="photo1.jpg" alt="عکس اول مائده">
    <img src="photo2.jpg" alt="عکس دوم مائده">
    <img src="photo3.jpg" alt="عکس سوم مائده">
    <img src="photo4.jpg" alt="عکس چهارم مائده">
    <img src="photo5.jpg" alt="عکس پنجم مائده">
    <img src="photo6.jpg" alt="عکس ششم مائده">
    <img src="photo7.jpg" alt="عکس هفتم مائده">
    <img src="photo8.jpg" alt="عکس هشتم مائده">
    </div>

    <a class="back-link" id="backLink" href="index.html">
        بازگشت به صفحهٔ اصلی
    </a>

    <dialog id="imageViewer">
        <button id="closeViewer" type="button">بستن ✕</button>
        <img id="largeImage" src="" alt="">
    </dialog>

    <script>
        const translations = {
            fa: {
                title: "عکاسی پرتره",
                intro: "مجموعه‌ای از عکس‌های این پروژه",
                back: "بازگشت به صفحهٔ اصلی",
                alt: "عکس شماره",
                close: "بستن ✕"
            },
            en: {
                title: "Portrait Photography",
                intro: "A collection of photos from this project",
                back: "Back to Home",
                alt: "Project photo",
                close: "Close ✕"
            },
            it: {
                title: "Fotografia di ritratto",
                intro: "Una raccolta di foto di questo progetto",
                back: "Torna alla pagina principale",
                alt: "Foto del progetto",
                close: "Chiudi ✕"
            }
        };

        function applyLanguage(lang) {
            if (!translations[lang]) lang = "fa";

            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

            document.getElementById("galleryTitle").textContent =
                translations[lang].title;

            document.getElementById("galleryIntro").textContent =
                translations[lang].intro;

            document.getElementById("backLink").textContent =
                translations[lang].back;

            document.getElementById("closeViewer").textContent =
                translations[lang].close;

            document.querySelectorAll(".gallery-grid img").forEach((img, index) => {
                img.alt = translations[lang].alt + " " + (index + 1);
            });

            document.title = translations[lang].title + " | Haniyeh Haddadi";
        }

        let selectedLanguage = "fa";

        try {
            selectedLanguage = localStorage.getItem("selectedLanguage") || "fa";
        } catch (error) {
            selectedLanguage = "fa";
        }

        applyLanguage(selectedLanguage);

        const viewer = document.getElementById("imageViewer");
        const largeImage = document.getElementById("largeImage");
        const closeViewer = document.getElementById("closeViewer");

        document.querySelectorAll(".gallery-grid img").forEach(function (img) {
            img.addEventListener("click", function () {
                largeImage.src = img.src;
                largeImage.alt = img.alt;
                viewer.showModal();
            });
        });

        closeViewer.addEventListener("click", function () {
            viewer.close();
        });

        viewer.addEventListener("click", function (event) {
            if (event.target === viewer) {
                viewer.close();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && viewer.open) {
                viewer.close();
            }
        });
    </script>
</body>
</html>
